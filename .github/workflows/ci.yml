name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"   # = pyproject requires-python; tests/unit/test_python_version.py keeps them one
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  # ── Unit tests (no DB required) ────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        # Unit tests import the scoring/geo modules (scikit-learn, rasterio,
        # netCDF4, …), so the full runtime extras must be present at collection
        # time — [dev] alone only brings the test tooling.
        run: pip install -e ".[all,dev]"

      - name: Check migration graph (single head, no dangling links)
        # Static change-control guard — fails the build if the Alembic chain ever
        # splits into multiple heads again (the drift that forced create_all). No DB needed.
        run: python -m scripts.check_migrations

      - name: Run unit tests
        run: pytest tests/unit/ -m "not integration" -q --tb=short

  # ── Integration tests (TimescaleDB sidecar) ────────────────────────────
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB:       climate
          POSTGRES_USER:     platform
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U platform -d climate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # psycopg v3 driver (postgresql+psycopg://) — matches pyproject/.env; the
      # bare postgresql:// scheme would route SQLAlchemy to psycopg2, which isn't installed.
      DATABASE_URL: postgresql+psycopg://platform:devpassword@localhost:5433/climate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        # Same full extras as the unit job — pytest collects all of tests/unit/
        # (to select the integration-marked ones), so every import dep must be present.
        run: pip install -e ".[all,dev]"

      - name: Migration round-trip (every revision up and down, schema restored exactly)
        # Builds a scratch database from nothing one revision at a time, then undoes each step and requires the exact
        # prior schema (scripts/check_migration_roundtrip.py, error log E25). Runs here with TimescaleDB present, so
        # the hypertable branches of the migrations are exercised too.
        env:
          MIGCHECK_ADMIN_URL: postgresql://platform:devpassword@localhost:5433/postgres
        run: python -m scripts.check_migration_roundtrip

      - name: Build schema (migrations to head — the app's real startup path)
        # The running app builds its schema via init_db() → alembic upgrade head (core/db/config.py, called from the
        # FastAPI lifespan); migrations are the source of truth. CI builds the integration DB the same way.
        run: python -c "from core.db.config import init_db; init_db()"

      - name: Run integration tests
        run: pytest tests/unit/ -m "integration" -q --tb=short

  # ── Lint ───────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff (the exact version pyproject.toml pins for dev)
        run: pip install "$(python -c 'import tomllib; print(next(r for r in tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["dev"] if r.startswith("ruff")))')"

      - name: Run ruff
        # Rule selection + ignores live in pyproject.toml [tool.ruff.lint]
        run: ruff check .

  # ── Docker build + push (main branch only) ─────────────────────────────
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          target: api
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-api:latest
            ${{ env.IMAGE_NAME }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          target: worker
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}-worker:latest
            ${{ env.IMAGE_NAME }}-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Deploy to Kubernetes (main branch only) ────────────────────────────
  deploy:
    name: Deploy to k8s
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production   # requires manual approval gate in GitHub settings

    steps:
      # Deploys only where a production cluster is connected (secret KUBECONFIG, a base64 kubeconfig). Without one the
      # job says so and skips, rather than failing on every push and hiding real failures (error log E26) — the
      # cluster is a go-live dependency (docs/GO_LIVE_EXTERNAL_DEPENDENCIES.md).
      - name: Is a production cluster configured?
        id: cluster
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -n "$KUBECONFIG_B64" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"
          else echo "configured=false" >> "$GITHUB_OUTPUT"
               echo "::notice title=Deploy skipped::No production cluster is connected (secret KUBECONFIG is not set) — the image is built and pushed; nothing is deployed."
          fi

      - uses: actions/checkout@v4
        if: steps.cluster.outputs.configured == 'true'

      - name: Set up kubectl
        if: steps.cluster.outputs.configured == 'true'
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        if: steps.cluster.outputs.configured == 'true'
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > /tmp/kubeconfig

      - name: Update image tags in manifests
        if: steps.cluster.outputs.configured == 'true'
        run: |
          sed -i "s|:latest|:${{ github.sha }}|g" infra/k8s/api-deployment.yaml
          sed -i "s|:latest|:${{ github.sha }}|g" infra/k8s/scorer-cronjob.yaml
          sed -i "s|:latest|:${{ github.sha }}|g" infra/k8s/ingestion-cronjob.yaml
          sed -i "s|OWNER|${{ github.repository_owner }}|g" infra/k8s/api-deployment.yaml
          sed -i "s|OWNER|${{ github.repository_owner }}|g" infra/k8s/scorer-cronjob.yaml
          sed -i "s|OWNER|${{ github.repository_owner }}|g" infra/k8s/ingestion-cronjob.yaml

      - name: Apply manifests
        if: steps.cluster.outputs.configured == 'true'
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl apply -f infra/k8s/secret.yaml        # pre-created in cluster
          kubectl apply -f infra/k8s/api-deployment.yaml
          kubectl apply -f infra/k8s/scorer-cronjob.yaml
          kubectl apply -f infra/k8s/ingestion-cronjob.yaml
          kubectl apply -f infra/k8s/ingress.yaml

      - name: Wait for rollout
        if: steps.cluster.outputs.configured == 'true'
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: |
          kubectl rollout status deployment/climate-api \
            -n climate-platform --timeout=120s
