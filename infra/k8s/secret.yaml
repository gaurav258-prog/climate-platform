# Secret template — DO NOT commit real values.
# In production, inject via CI/CD (GitHub Actions secret → kubectl create secret)
# or use a secrets manager (AWS Secrets Manager, GCP Secret Manager, Vault).
#
# To create from CLI:
#   kubectl create secret generic climate-platform-secrets \
#     --from-literal=DATABASE_URL="postgresql://..." \
#     --from-literal=FIRMS_API_KEY="..." \
#     --from-literal=SENTINEL_HUB_CLIENT_ID="sh-..." \
#     --from-literal=SENTINEL_HUB_CLIENT_SECRET="..." \
#     --from-literal=NEWS_API_KEY="" \
#     -n climate-platform
apiVersion: v1
kind: Secret
metadata:
  name: climate-platform-secrets
  namespace: climate-platform
type: Opaque
stringData:
  DATABASE_URL:         "postgresql://platform:CHANGE_ME@db-host:5432/climate"
  MLFLOW_TRACKING_URI:  "http://mlflow:5001"
  FIRMS_API_KEY:        ""
  # Copernicus OData username/password (Path B raw-scene download; optional)
  COPERNICUS_USER:      ""
  COPERNICUS_PASSWORD:  ""
  # Copernicus Sentinel Hub OAuth client — activates the Sentinel-1 SAR (flood) + Sentinel-3 SLSTR (heat) feeds
  SENTINEL_HUB_CLIENT_ID:     ""
  SENTINEL_HUB_CLIENT_SECRET: ""
  # Regulatory-news early signal — empty = free keyless GDELT; set to use NewsAPI.org instead
  NEWS_API_KEY:         ""
