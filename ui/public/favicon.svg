<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="tl-hex" x1="24" y1="3" x2="24" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b4a9e"/>
      <stop offset="1" stop-color="#04070f"/>
    </linearGradient>
    <radialGradient id="tl-lumen" cx="24" cy="17" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bfe4ff"/>
      <stop offset="0.45" stop-color="#3aa0ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3aa0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- the hex cell (H3 heritage) -->
  <polygon points="44,24 34,41.3 14,41.3 4,24 14,6.7 34,6.7"
           fill="url(#tl-hex)" stroke="#3aa0ff" stroke-opacity="0.55"
           stroke-width="1.5" stroke-linejoin="round"/>
  <!-- the lumen: light rising within the Earth-cell -->
  <circle cx="24" cy="17" r="14" fill="url(#tl-lumen)"/>
  <circle cx="24" cy="15.5" r="3.1" fill="#eaf6ff"/>
</svg>
