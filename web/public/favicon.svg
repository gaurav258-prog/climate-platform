<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Tellumen mark (docs/BRAND.md §4) — same geometry and colours as src/components/BrandMark.tsx -->
  <defs>
    <linearGradient id="hex" x1="24" y1="4" x2="24" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1560c4"/>
      <stop offset="1" stop-color="#06152e"/>
    </linearGradient>
    <radialGradient id="lumen" cx="24" cy="22" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#9fd4ff"/>
      <stop offset="0.7" stop-color="#3aa0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3aa0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- the hex cell (H3 heritage) -->
  <polygon points="44,24 34,41.3 14,41.3 4,24 14,6.7 34,6.7"
           fill="url(#hex)" stroke="#6cb8ff" stroke-width="3" stroke-linejoin="round"/>
  <!-- the lumen: light rising within the Earth-cell -->
  <circle cx="24" cy="22" r="12" fill="url(#lumen)"/>
  <circle cx="24" cy="21" r="4.6" fill="#f2f9ff"/>
</svg>
